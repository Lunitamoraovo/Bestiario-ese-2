
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css"/>
    <title>Bestuario</title>
</head>

<body style="background-image: url('El\ texto\ del\ párrafo\ \(2\).png');
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
             background-attachment: fixed;">

    <h1>Skecht Project</h1>
    <h2>¿Acaso tienes problemas para dibujar?</h2>
    <h2>¿No encuentras la inspiración suficiente para crear?</h2>

    <section class="generador">
        <h2>Combina tu personaje</h2>
        <p>¡Mezcla las piezas y descubre nuevas poses!</p>

        <div class="cuadros">
            <div class="cuadro">
                <span class="etiqueta">01 · CABEZA</span>
                <img id="imagenCabeza"
                     src="imagenes/poses/cabeza 1.png"
                     alt="Referencia de cabeza">
                
            </div>

            <div class="cuadro">
                <span class="etiqueta">02 · TORSO</span>
                <img id="imagenTorso"
                     src="imagenes/poses/torso 1.png"
                     alt="Referencia de torso">
                
            </div>

            <div class="cuadro">
                <span class="etiqueta">03 · PIERNAS</span>
                <img id="imagenPiernas"
                     src="imagenes/poses/piernas 1.png"
                     alt="Referencia de piernas">
                
            </div>
        </div>
        <button class="boton-general" id="boton">
            ¡Sorpréndeme! 
        </button>
    </section>

<script>
    alert("¡El HTML está funcionando!");
</script>

<script src="script.js"></script>

</body>
</html>
