
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css"/>
    <title>Bestuario</title>
</head>

<body style="background-image: url('El\ texto\ del\ párrafo\ \(2\).png');
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
             background-attachment: fixed;">


    <h1>Skecht Project</h1>
    <h2> ¿Acaso tienes problemas para dibujar? </h2>
       <h2>¿No encuentras la inspiración suficiente para crear?</h2> 


<section class="generador">
    <h2>Combina tu criatura</h2>
    <p>¡Mezcla piezas y descubre nuevas poses!</p>

    <div class="cuadros">

        <div class="cuadro">
            <span class="etiqueta">01 · CABEZA</span>
            <img id="imagenCabeza"
                 src="cag"
                 alt="Referencia de cabeza">
            <button onclick="cambiarImagen('cabeza')">
                Cambiar ↻
            </button>
        </div>

        <div class="cuadro">
            <span class="etiqueta">02 · TORSO</span>
            <img id="imagenTorso"
                 src="imagenes/poses/torso1.png"
                 alt="Referencia de torso">
            <button onclick="cambiarImagen('torso')">
                Cambiar ↻
            </button>
        </div>

        <div class="cuadro">
            <span class="etiqueta">03 · PIERNAS</span>
            <img id="imagenPiernas"
                 src="imagenes/poses/piernas1.png"
                 alt="Referencia de piernas">
            <button onclick="cambiarImagen('piernas')">
                Cambiar ↻
            </button>
        </div>

    </div>

    <button class="boton-general" onclick="generarTodo()">
        ¡Sorpréndeme!
    </button>
</section>

   

</body>
</html>
